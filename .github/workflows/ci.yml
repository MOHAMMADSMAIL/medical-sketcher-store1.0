name: CI

on:
  push:
    branches: [main, feature/luxury-storefront]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and lint
        run: npm run check
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test -- --passWithNoTests
